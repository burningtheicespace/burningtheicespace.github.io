/* intro */
#intro{position:fixed;inset:0;display:grid;place-items:center;z-index:2;background:var(--bg);transition:opacity 1s cubic-bezier(.4,0,.2,1),filter 1s cubic-bezier(.4,0,.2,1)}
#intro.out{opacity:0;filter:blur(6px);pointer-events:none}
#intro .ib{transition:transform 1.1s cubic-bezier(.22,1,.36,1)}
#intro.out .ib{transform:scale(.96) translateY(-10px)}
.ib{display:grid;justify-items:center;gap:26px}
#intro .sym{width:clamp(64px,9vw,110px);will-change:clip-path,transform,opacity,filter;animation:build 1.6s cubic-bezier(.22,1,.36,1) both .1s}
.iw{overflow:hidden}
.iw b{display:block;font-family:Archivo,Arial,sans-serif;font-weight:900;font-variation-settings:"wdth" 125;color:var(--red);text-transform:uppercase;letter-spacing:-.02em;line-height:.85;font-size:clamp(22px,4.2vw,52px);white-space:nowrap;will-change:transform,opacity;animation:rise 1.3s cubic-bezier(.22,1,.36,1) both .7s}
.bar{width:clamp(120px,16vw,200px);height:1px;background:var(--rule);overflow:hidden}
.bar{opacity:0;animation:fadein .8s ease both .9s}
.bar i{display:block;height:100%;background:var(--fg);transform-origin:left;animation:load 1.8s cubic-bezier(.65,0,.35,1) both 1s}
@keyframes build{0%{clip-path:inset(100% 0 0 0);opacity:0;transform:translateY(14px) scale(.94);filter:blur(10px)}55%{opacity:1;filter:blur(0)}100%{clip-path:inset(0 0 0 0);opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{transform:translateY(105%);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{to{opacity:1}}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* gate */
#gate{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
#gate .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
#gate .top .sym{width:22px}
#gate .mid{display:grid;place-items:center}
.box{width:min(560px,100%);display:grid;gap:22px}
.box .t{text-wrap:balance;font-size:clamp(26px,3.2vw,40px);font-weight:500;letter-spacing:-.035em;line-height:1;margin:0}
.field{display:flex;align-items:center;border-bottom:1px solid var(--rule);transition:border-color .3s}
.field:focus-within{border-color:var(--fg)}
#staticrypt-password{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:inherit;font-size:20px;letter-spacing:.02em;padding:12px 0 12px}
#staticrypt-password::placeholder{color:var(--muted)}
.go{background:none;border:0;color:var(--fg);font-size:24px;line-height:1;padding:8px 0 8px 14px;cursor:pointer;transition:transform .4s var(--ease),color .2s}
.go:hover{transform:translateX(4px);color:var(--red)}
.go:focus-visible,#staticrypt-password:focus-visible{outline:none}
.go:focus-visible{color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:20px}
.remember{display:flex;gap:8px;align-items:center;cursor:pointer;color:var(--muted)}
.remember input{appearance:none;width:12px;height:12px;border:1px solid var(--muted);border-radius:50%;margin:0;display:grid;place-items:center}
.remember input:checked{background:var(--fg);border-color:var(--fg)}
.err{color:var(--red);opacity:0;transition:opacity .3s}
.err.on{opacity:1}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{20%,80%{transform:translateX(-2px)}30%,70%{transform:translateX(5px)}40%,60%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.in>*{animation:fadeup 1s cubic-bezier(.22,1,.36,1) both .25s}
